sections:
  - title: Actual formula
    body: |-
      Let A be vial amount, Vv vial volume, Vf selected final prepared volume, D ordered dose, and unit factor S(mg)=1000, S(mcg)=1:

      - vial concentration = A / Vv
      - prepared concentration = A / Vf
      - prepared concentration in ordered units = (A × S(vial unit) / S(ordered unit)) / Vf
      - administration volume mL = D / prepared concentration in ordered units

      The prototype blocks Vf < Vv and D greater than one vial's converted available amount.
    required: true
  - title: Actual implementation and rounding disclosure
    body: >-
      Inputs are converted with JavaScript Number and operations use IEEE-754
      arithmetic. All displayed numbers use en-CA Intl.NumberFormat with no more
      than six fractional digits. No clinically approved rounding or measurable-
      volume rule is implemented; the UI delegates these to local policy. The
      known positive-to-displayed-zero risk is disclosed.
    required: true
  - title: Worked example
    body: |-
      For A=10 mg, Vv=1 mL, Vf=50 mL and D=2000 mcg:

      1. Vial concentration: 10 mg ÷ 1 mL = 10 mg/mL.
      2. Prepared concentration: 10 mg ÷ 50 mL = 0.2 mg/mL.
      3. Unit conversion: 0.2 mg/mL × 1000 mcg/mg = 200 mcg/mL.
      4. Administration volume: 2000 mcg ÷ 200 mcg/mL = 10 mL.

      Playwright observes these substituted equations and the concealed/revealed 10 mL output in SUB-002. The automated reproduction is not the required independent pharmacy/calculation authorization.
    required: true
  - title: Current verification evidence and boundary
    body: >-
      Existing Playwright tests exercise representative same/cross-unit paths,
      one-vial blocking, six volumes, review state, local records, privacy,
      responsiveness and offline installation. Lean proves properties of a
      separate exact-rational reference model. No differential conformance test
      proves the JavaScript prototype equivalent to that model. Neither test
      suite proves clinical appropriateness.
    required: true
