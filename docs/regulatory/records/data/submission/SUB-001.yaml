sections:
  - title: Exact included functions
    body: >-
      The prototype includes manual entry of medication display name, vial
      amount/unit/volume and ordered dose/unit; six final prepared volume
      selections; mg/mcg conversion; dilution arithmetic; substituted equation
      review before result reveal; acknowledgement before history save;
      localStorage favourites and history; English UI; installable manifest;
      offline app-shell cache; and visible version/source identity.
    required: true
  - title: Exact absent functions
    body: >-
      There is no drug library, patient model, dose selection/range check, route
      or rate recommendation, order verification, barcode, camera, OCR, EHR,
      pharmacy, pump, medical-signal, account, cloud sync, telemetry, analytics,
      crash upload or AI/ML function.
    required: true
  - title: Represented-use limits
    body: >-
      The UI states “Prototype only — not for patient care,” tells the user the
      app does not recommend a dose, requires verification against the order,
      vial label, pharmacy guidance and local policy, warns to verify overfill
      and preparation method, and says local policy controls measurable volume
      and rounding. The submitted intended-use and exclusions must not
      contradict any actual function or foreseeable immediate-use workflow.
    required: true
