sections:
  - title: Classification-relevant risk
    body: >-
      A wrong or misunderstood mL result used in immediate medication
      preparation could contribute to serious injury or death. This consequence
      is central to criterion 3 and fallback classification. Transparent
      arithmetic and external verification may reduce reliance but do not erase
      immediate use or establish acceptable residual risk.
    required: true
  - title: Known prototype limitations
    body: >-
      Known limitations include permissive browser/Number input and arithmetic,
      positive values that may display as zero after six-decimal formatting,
      no approved numeric bounds or clinical rounding rule, weak stored-record
      validation and trust of stored derived values, no complete migration or
      recovery control, incomplete accessibility/usability evidence, no CSP or
      final SBOM/security review, incomplete update/rollback proof, public
      prototype hosting and no final bilingual label/IFU.
    required: true
  - title: Existing conceptual safeguards
    body: >-
      Current UI safeguards include closed mg/mcg selectors, six final-volume
      choices, finite-positive checks, final-volume and one-vial blocking,
      visible substituted equations, check-every-step gating, edit reset,
      acknowledgement, warnings, no patient-information prompt, and persistent
      prototype status. These are implementation facts, not verified residual-
      risk controls.
    required: true
