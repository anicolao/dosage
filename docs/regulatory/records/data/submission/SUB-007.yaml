sections:
  - title: Criterion 1 — no image/IVD/signal processing
    body: >-
      Proposed met. The exact prototype accepts manual text/selections only and
      has no camera, image, IVD, monitoring-device or signal-acquisition input.
    required: true
  - title: Criterion 2 — displays or analyzes routinely used medical information
    body: >-
      Proposed met, subject to pharmacy confirmation. It performs established
      dimensional arithmetic on manually entered vial-label facts, a selected
      final volume and an already-authorized ordered dose. It contains no drug
      library or novel patient-specific algorithm.
    required: true
  - title: Criterion 3 — only supports decision making
    body: >-
      Ambiguous and submitted for Health Canada determination. The prototype
      does not select, assess or recommend treatment, but the calculated mL may
      be acted on immediately or in the near term during medication preparation.
      Health Canada's guidance associates immediate/near-term action with
      driving clinical/patient management.
    required: true
  - title: Criterion 4 — does not replace clinical judgement
    body: >-
      Proposed met in functional concept. The user sees every substituted
      equation and must check each before the result is revealed. The prototype
      resembles Health Canada's published example of manually entered drug-
      label calculation that can be independently reviewed, but known numeric
      and usability limitations are disclosed and equivalence is not assumed.
    required: true
  - title: Overall manufacturer position
    body: null
    required: true
