sections:
  - title: Conservative fallback analysis
    body: >-
      The mL output may drive immediate medication preparation and an erroneous
      result could contribute to serious injury or death. The prototype does not
      select a medication/dose or diagnose a condition. The manufacturer must
      analyze current Rules 10(1), 10(2), 12 and any other applicable rule and
      apply Health Canada's significance/situation framework to the exact
      submitted user, setting and exclusions. Class III remains a planning
      possibility for critical use unless a current reviewed analysis supports
      another route.
    required: true
  - title: Published-example comparison
    body: >-
      Compare the exact prototype with Health Canada's non-device example for
      drug dosing calculated from manually entered drug-label parameters where
      the calculation is independently reviewable. Distinguish the prototype's
      administration-volume output, immediate-preparation context, final-volume
      selection, local records and known implementation limitations.
    required: true
