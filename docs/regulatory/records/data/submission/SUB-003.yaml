sections:
  - title: Current runtime components
    body: |-
      `Nurse → Svelte App.svelte reactive UI/Number calculation → KaTeX equation rendering → browser DOM`

      `Svelte UI ↔ localStorage dosage.favourites.v2 / dosage.history.v2`

      `Static HTTPS host → generated cache-first service worker → app-shell Cache Storage → Svelte UI`

      All calculation code and runtime record handling are currently in `src/App.svelte`. There is no runtime application server or clinical-system interface.
    required: true
  - title: Current network and storage facts
    body: >-
      Initial load and uncached same-origin in-scope assets may use the static
      host. The service worker ignores cross-origin and out-of-scope requests
      rather than providing a formal deny layer. The app source contains no
      fetch/XHR/beacon/WebSocket/EventSource, analytics or telemetry logic.
      Favourites/history are JSON arrays in localStorage and may reveal
      medication context; they have no cloud backup or encryption provided by
      the app.
    required: true
  - title: Build and third-party boundary
    body: >-
      Vite/Svelte/KaTeX and locked npm dependencies build the static app. Vite
      injects package version and supplied/Git short revision and generates the
      service worker from the output inventory. GitHub Pages is a public
      prototype review channel, not a clinical distribution channel.
    required: true
